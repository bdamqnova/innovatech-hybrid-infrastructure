name: Application CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/application-deploy.yml"

  workflow_dispatch:

env:
  AWS_DEFAULT_REGION: eu-central-1

jobs:
  test:
    name: Test Web Application
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify application files
        run: |
          test -f app/index.html
          test -f app/app.py
          test -f app/Dockerfile
          test -f app/nginx.conf
          test -f app/requirements.txt

      - name: Check frontend contains Innovatech
        run: grep -q "Innovatech" app/index.html

      - name: Check HTML contains title
        run: grep -q "<title>" app/index.html

      - name: Check Flask API exists
        run: grep -q "/api/status" app/app.py

      - name: Web application tests passed
        run: echo "Web application tests passed successfully"

  deploy:
    name: Rolling Deployment
    runs-on: self-hosted
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Find running web servers
        id: web-servers
        run: |
          WEB_IDS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=innovatech-web" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -z "$WEB_IDS" ]; then
            echo "No running web servers found"
            exit 1
          fi

          echo "Web servers:"
          echo "$WEB_IDS"

          echo "web_ids=$WEB_IDS" >> "$GITHUB_OUTPUT"

      - name: Deploy application one server at a time
        env:
          WEB_IDS: ${{ steps.web-servers.outputs.web_ids }}
        run: |
          APP_ARCHIVE=$(tar -C app -czf - . | base64 -w 0)

          for INSTANCE_ID in $WEB_IDS; do
            echo "Deploying application to $INSTANCE_ID"

            PARAMETERS=$(jq -nc \
              --arg archive "$APP_ARCHIVE" \
              '{
                commands: [
                  "mkdir -p /opt/innovatech",
                  "echo " + $archive + " | base64 -d | tar -xzf - -C /opt/innovatech",
                  "cd /opt/innovatech",

                  "DB_HOST=$(aws ssm get-parameter --name /innovatech/db/host --query Parameter.Value --output text --region eu-central-1)",
                  "DB_NAME=$(aws ssm get-parameter --name /innovatech/db/name --query Parameter.Value --output text --region eu-central-1)",
                  "DB_USER=$(aws ssm get-parameter --name /innovatech/db/user --query Parameter.Value --output text --region eu-central-1)",
                  "DB_PASSWORD=$(aws ssm get-parameter --name /innovatech/db/password --with-decryption --query Parameter.Value --output text --region eu-central-1)",

                  "docker network inspect innovatech >/dev/null 2>&1 || docker network create innovatech",

                  "docker build -t innovatech-flask:latest /opt/innovatech",

                  "docker rm -f flask-app >/dev/null 2>&1 || true",
                  "docker rm -f nginx >/dev/null 2>&1 || true",

                  "docker run -d --name flask-app --restart always --network innovatech -e DB_HOST=\"$DB_HOST\" -e DB_NAME=\"$DB_NAME\" -e DB_USER=\"$DB_USER\" -e DB_PASSWORD=\"$DB_PASSWORD\" innovatech-flask:latest",

                  "docker run -d --name nginx --restart always --network innovatech -p 80:80 -v /opt/innovatech/index.html:/usr/share/nginx/html/index.html:ro -v /opt/innovatech/nginx.conf:/etc/nginx/nginx.conf:ro nginx:latest",

                  "sleep 5",

                  "curl -fsS http://localhost/ > /dev/null",
                  "curl -fsS http://localhost/health > /dev/null",
                  "curl -fsS http://localhost/api/status > /dev/null"
                ]
              }')

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "$PARAMETERS" \
              --query "Command.CommandId" \
              --output text)

            echo "Waiting for deployment command $COMMAND_ID"

            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" != "Success" ]; then
              echo "Deployment failed on $INSTANCE_ID"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID"

              exit 1
            fi

            echo "$INSTANCE_ID deployed successfully"
          done

      - name: Deployment completed
        run: echo "Rolling deployment completed successfully"
